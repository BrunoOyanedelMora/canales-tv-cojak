<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiview Premium | Canales Chilenos</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background-color: #111;
            font-family: 'Brave Sans', Arial, sans-serif;
            color: white;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            text-align: center;
            color: #ff6600;
        }
        /* Cuadrícula estilo Multiview (3 columnas x 2 filas) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 12px;
            flex-grow: 1;
        }
        .canal-box {
            background-color: #000;
            border: 2px solid #333;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .canal-header {
            background-color: #222;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .canal-tag {
            background-color: #555;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: black;
        }
        .error-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Multiview Premium | 6 Canales en Vivo</h2>

    <div class="grid-container">
        <div class="canal-box">
            <div class="canal-header"><span>TVN</span><span class="canal-tag">General</span></div>
            <video id="video-tvn" controls autoplay muted playsinline></video>
        </div>
        <div class="canal-box">
            <div class="canal-header"><span>T13</span><span class="canal-tag">Noticias</span></div>
            <video id="video-t13" controls autoplay muted playsinline></video>
        </div>
        <div class="canal-box">
            <div class="canal-header"><span>CHV</span><span class="canal-tag">General</span></div>
            <video id="video-chv" controls autoplay muted playsinline></video>
        </div>
        <div class="canal-box">
            <div class="canal-header"><span>MEGA</span><span class="canal-tag">General</span></div>
            <video id="video-mega" controls autoplay muted playsinline></video>
        </div>
        <div class="canal-box">
            <div class="canal-header"><span>CNN CHILE</span><span class="canal-tag">Noticias</span></div>
            <video id="video-cnn" controls autoplay muted playsinline></video>
        </div>
        <div class="canal-box">
            <div class="canal-header"><span>24 HORAS</span><span class="canal-tag">Noticias</span></div>
            <video id="video-24h" controls autoplay muted playsinline></video>
        </div>
    </div>

    <script>
        // Mapeo manual directo usando los enlaces estables de tu lista M3U
        const canalesStreaming = {
            'video-tvn': 'https://mdstrm.com/live-stream-playlist-v/555c9a91eb4886825b07ee7b.m3u8',
            'video-t13': 'https://redirector.rudo.video/hls-video/10b92cafdf3646cbc1e727f3dc76863621a327fd/t13/t13.smil/playlist.m3u8',
            'video-chv': 'https://redirector.rudo.video/hls-video/10b92cafdf3646cbc1e727f3dc76863621a327fd/chv/chv.smil/playlist.m3u8',
            'video-mega': 'https://unlimited1-cl-isp.dps.live/mega/mega.smil/playlist.m3u8',
            'video-cnn': 'https://redirector.rudo.video/hls-video/lvcl5/cnn/cnn.smil/playlist.m3u8?DVR',
            'video-24h': 'https://mdstrm.com/live-stream-playlist/689ba606ecfe7915e1f8f741.m3u8'
        };

        // Función para inicializar el reproductor HLS en cada cuadro de video
        function iniciarStreaming(idVideo, url) {
            const video = document.getElementById(idVideo);
            
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
            } 
            // Soporte nativo para navegadores basados en Apple (Safari / iOS)
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            }
        }

        // Ejecutar la carga simultánea al abrir la página
        window.addEventListener('DOMContentLoaded', () => {
            for (const id in canalesStreaming) {
                iniciarStreaming(id, canalesStreaming[id]);
            }
        });
    </script>
</body>
</html>
