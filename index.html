<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiview Premium | 6 Canales Chilenos</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b0f;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Cuadrícula perfecta de 3 columnas y 2 filas */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            width: 100vw;
            height: 100vh;
            gap: 6px; 
            padding: 6px;
        }

        /* Contenedor de cada canal */
        .video-box {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
        }

        /* Forzamos a los reproductores incrustados a ocupar todo el espacio */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Etiqueta flotante para identificar el canal */
        .channel-label {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.83);
            color: #fff;
            padding: 5px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
            z-index: 10;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .video-box:hover .channel-label {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="grid-container">
        
        <div class="video-box">
            <div class="channel-label">TVN</div>
            <iframe src="https://alplox.github.io/json-teles/player.html?url=https://tvn-live.mediastream.am/live/tvn/smil:tvn.smil/playlist.m3u8" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <div class="video-box">
            <div class="channel-label">T13</div>
            <iframe src="https://alplox.github.io/json-teles/player.html?url=https://tele13-live.mediastream.am/live/tele13/smil:tele13.smil/playlist.m3u8" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <div class="video-box">
            <div class="channel-label">CHV</div>
            <iframe src="https://alplox.github.io/json-teles/player.html?url=https://chv-live.mediastream.am/live/chv/smil:chv.smil/playlist.m3u8" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <div class="video-box">
            <div class="channel-label">MEGA</div>
            <iframe src="https://alplox.github.io/json-teles/player.html?url=https://mega-live.mediastream.am/live/mega/smil:mega.smil/playlist.m3u8" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <div class="video-box">
            <div class="channel-label">CNN Chile</div>
            <iframe src="https://alplox.github.io/json-teles/player.html?url=https://cnnchile-live.mediastream.am/live/cnnchile/smil:cnnchile.smil/playlist.m3u8" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <div class="video-box">
            <div class="channel-label">24 Horas</div>
            <iframe src="https://alplox.github.io/json-teles/player.html?url=https://24horas-live.mediastream.am/live/24horas/smil:24horas.smil/playlist.m3u8" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

    </div>

</body>
</html>
