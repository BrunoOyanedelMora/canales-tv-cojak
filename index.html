<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiview YouTube Chile</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            box-sizing: border-box;
        }
        /* Cuadrícula pura de 2x2 absoluta, libre de títulos u overlays */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            width: 100%;
            height: 100%;
            gap: 0px; 
        }
        .canal-box {
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        /* Ajustamos las propiedades para el iframe en lugar de video */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <!-- 24 Horas -->
        <div class="canal-box">
            <iframe src="https://www.youtube.com/embed/Ue4ECy4cubg?autoplay=1&mute=1&live=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <!-- T13 -->
        <div class="canal-box">
            <iframe src="https://www.youtube.com/embed/V1mn3KjPBqc?autoplay=1&mute=1&live=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <!-- CHV -->
        <div class="canal-box">
            <iframe src="https://www.youtube.com/embed/IEVv3T4ujj0?autoplay=1&mute=1&live=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <!-- MEGA -->
        <div class="canal-box">
            <iframe src="https://www.youtube.com/embed/Mnyz9UWHx2c?autoplay=1&mute=1&live=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
