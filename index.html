<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi TV en GitHub Pages</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            margin: 0;
            display: flex;
            height: 100vh;
        }
        #lista-canales {
            width: 300px;
            background-color: #222;
            overflow-y: auto;
            border-right: 2px solid #333;
            padding: 10px;
        }
        .canal-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #333;
            color: white;
            border: none;
            margin-bottom: 8px;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
        }
        .canal-btn:hover {
            background: #555;
        }
        #contenedor-reproductor {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
        }
        .video-js {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div id="lista-canales">
        <h3>Mis Canales</h3>
        <div id="botones-canales">Cargando canales...</div>
    </div>

    <div id="contenedor-reproductor">
        <video id="mi-reproductor" class="video-js vjs-default-skin" controls preload="auto" autoplay muted></video>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        // Inicializar el reproductor de video
        const player = videojs('mi-reproductor');

        // Función para leer y procesar el archivo M3U
        async function cargarM3U() {
            try {
                // Buscamos el archivo canales.m3u que está en tu repositorio
                const respuesta = await fetch('canales.m3u');
                const texto = await respuesta.text();
                
                const lineas = texto.split('\n');
                const contenedor = document.getElementById('botones-canales');
                contenedor.innerHTML = ''; // Limpiar mensaje de carga

                let nombreCanal = '';

                lineas.forEach(linea => {
                    linea = linea.trim();
                    
                    // Si la línea contiene la información del canal (#EXTINF)
                    if (linea.startsWith('#EXTINF:')) {
                        // Extraemos el nombre del canal (lo que va después de la última coma)
                        const partes = linea.split(',');
                        nombreCanal = partes[partes.length - 1].trim();
                    } 
                    // Si la línea es la URL del canal y ya tenemos un nombre guardado
                    else if (linea.startsWith('http') && nombreCanal !== '') {
                        const urlCanal = linea;

                        // Creamos el botón en la lista para este canal
                        const boton = document.createElement('button');
                        boton.className = 'canal-btn';
                        boton.innerText = nombreCanal;
                        
                        // Al hacer clic, el reproductor carga este canal
                        boton.onclick = () => {
                            player.src({
                                src: urlCanal,
                                type: 'application/x-mpegURL' // Formato HLS (.m3u8) común en IPTV
                            });
                            player.play();
                        };

                        contenedor.appendChild(boton);
                        nombreCanal = ''; // Resetear para el siguiente canal
                    }
                });

            } catch (error) {
                console.error("Error cargando la lista M3U:", error);
                document.getElementById('botones-canales').innerText = 'Error al cargar canales.';
            }
        }

        // Ejecutar la función al cargar la página
        cargarM3U();
    </script>
</body>
</html>
