<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiview Pro | Central de Operaciones</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden; /* Elimina cualquier barra de scroll */
        }
        /* Cuadrícula pura de 2x2 que llena el 100% de la pantalla */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            width: 100%;
            height: 100%;
            gap: 4px; /* Separación milimétrica y limpia entre transmisiones */
            background-color: #000;
        }
        .video-wrapper {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Mantiene la proporción de televisión 16:9 sin estirar */
            display: block;
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="video-wrapper"><video id="video-1" autoplay muted playsinline></video></div>
        <div class="video-wrapper"><video id="video-2" autoplay muted playsinline></video></div>
        <div class="video-wrapper"><video id="video-3" autoplay muted playsinline></video></div>
        <div class="video-wrapper"><video id="video-4" autoplay muted playsinline></video></div>
    </div>

    <script>
        const hlsInstances = {};
        let ultimoSyncId = "0";
        
        // Estructura fija de los 4 canales requeridos
        let canalesActuales = {
            1: { nombre: 'TVN', url: 'https://marine2.miplay.cl/tvnchile/index.m3u8' },
            2: { nombre: 'T13', url: 'https://redirector.rudo.video/hls-video/10b92cafdf3646cbc1e727f3dc76863621a327fd/t13/t13.smil/playlist.m3u8' },
            3: { nombre: 'CHV', url: 'https://redirector.rudo.video/hls-video/10b92cafdf3646cbc1e727f3dc76863621a327fd/chv/chv.smil/playlist.m3u8' },
            4: { nombre: 'MEGA', url: 'https://unlimited1-cl-isp.dps.live/mega/mega.smil/playlist.m3u8' }
        };

        function reproducirCanal(slotId, url) {
            const video = document.getElementById(`video-${slotId}`);
            if (!video) return;

            if (hlsInstances[slotId]) {
                hlsInstances[slotId].destroy();
                delete hlsInstances[slotId];
            }

            if (!url) return;

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hlsInstances[slotId] = hls;
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            }
        }

        // Conector en tiempo real con tu control_panel.py de la Mac
        async function verificarSenalesRemotas() {
            try {
                const respuesta = await fetch(`live-config.json?t=${Date.now()}`);
                if (!respuesta.ok) return;
                
                const datosNuevos = await respuesta.json();
                
                // Ejecuta la sincronización de tiempos en vivo si la pides desde tu Mac
                if (datosNuevos.sync_trigger && datosNuevos.sync_trigger !== ultimoSyncId) {
                    ultimoSyncId = datosNuevos.sync_trigger;
                    for (let i = 1; i <= 4; i++) {
                        const video = document.getElementById(`video-${i}`);
                        if (video && video.seekable && video.seekable.length > 0) {
                            video.currentTime = video.seekable.end(0) - 0.5; 
                        }
                    }
                }

                // Permite cambiar los streams de las 4 pantallas de forma remota si es necesario
                for (let i = 1; i <= 4; i++) {
                    if (datosNuevos[i]) {
                        const streamNuevo = datosNuevos[i];
                        if (!canalesActuales[i] || canalesActuales[i].url !== streamNuevo.url) {
                            canalesActuales[i] = streamNuevo;
                            reproducirCanal(i, streamNuevo.url);
                        }
                    }
                }
            } catch (e) {
                console.log("Leyendo órdenes del panel maestro...");
            }
        }

        // Escucha cambios cada 3 segundos en segundo plano
        setInterval(verificarSenalesRemotas, 3000);

        window.addEventListener('DOMContentLoaded', () => {
            // Inicialización de los 4 canales directo al abrir
            for (let i = 1; i <= 4; i++) {
                reproducirCanal(i, canalesActuales[i].url);
            }
            verificarSenalesRemotas();
        });
    </script>
</body>
</html>
